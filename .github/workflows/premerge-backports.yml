---
name: Pre-merge backport safety checks

# yamllint disable-line rule:truthy
on:
  pull_request:
    branches: [main]
    paths:
      - "extras/premerge/**"
      - "extras/*install*.sh"
      - ".docker/*.dockerfile"
      - ".github/workflows/premerge-backports.yml"
  push:
    branches: [main]
    paths:
      - "extras/premerge/**"
      - "extras/*install*.sh"
      - ".docker/*.dockerfile"
      - ".github/workflows/premerge-backports.yml"

permissions:
  contents: read

jobs:
  safety:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check staged patching and installer syntax
        run: |
          python3 extras/premerge/test_apply.py
          bash -n extras/ardusub-ubuntu-install.sh
          bash -n extras/ros-lyrical-gz-jetty-install.sh
