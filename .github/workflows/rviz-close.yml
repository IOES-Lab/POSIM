---
name: RViz close overlay

# yamllint disable-line rule:truthy
on:
  pull_request:
    paths:
      - "extras/rviz/**"
      - "extras/ros-lyrical-gz-jetty-install.sh"
      - ".docker/lyrical.*.dockerfile"
      - ".docker/test-image.sh"
      - ".github/workflows/rviz-close.yml"
  push:
    branches: [main]
    paths:
      - "extras/rviz/**"
      - "extras/ros-lyrical-gz-jetty-install.sh"
      - ".docker/lyrical.*.dockerfile"
      - ".docker/test-image.sh"
      - ".github/workflows/rviz-close.yml"

permissions:
  contents: read

jobs:
  close-tests:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-26.04, ubuntu-26.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    container: ros:lyrical-ros-base
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/ubuntu-mirrors
        with:
          configure-hosts: 'true'
      - name: Install build and private-display dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential cmake curl git xvfb xauth ros-lyrical-rviz2 \
            python3-colcon-common-extensions python3-colcon-override-check
      - name: Build and exercise accepted and canceled close
        shell: bash
        run: bash extras/rviz/build_overlay.sh /opt/posim/rviz-close
      - name: Verify downstream workspace environment
        shell: bash
        run: |
          source /opt/ros/lyrical/setup.bash
          source /opt/posim/rviz-close/install/local_setup.bash
          colcon --log-base /tmp/posim-check/log build \
            --base-paths examples/posim_demos \
            --build-base /tmp/posim-check/build \
            --install-base /tmp/posim-check/install --merge-install \
            --cmake-args -DBUILD_TESTING=OFF
          env -i HOME="$HOME" PATH=/usr/bin:/bin bash -c '
            source /tmp/posim-check/install/setup.bash
            bash extras/rviz/test_overlay.sh /opt/posim/rviz-close/install /tmp/rviz-fresh-shell
          '
      - name: Preserve regression and library-selection evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rviz-close-${{ matrix.runner }}
          path: |
            /opt/posim/rviz-close/regression/*.log
            /opt/posim/rviz-close/regression/*.maps
            /opt/posim/rviz-close/log/**
            /tmp/rviz-fresh-shell/*.log
            /tmp/rviz-fresh-shell/*.maps
          if-no-files-found: warn
