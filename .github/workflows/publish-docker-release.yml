---
name: Tag POSIM Docker release

# yamllint disable-line rule:truthy
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Git release tag (e.g. v1.0.0)"
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: posim-release-publication
  queue: max

jobs:
  tag:
    if: vars.POSIM_PUBLISH_IMAGES == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      IMAGE_NAME: ioeslab/posim
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          path: release-source
          ref: >-
            ${{ github.event_name == 'release' && github.sha ||
            format('refs/tags/{0}', inputs.release_tag) }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish the release tag for the existing image
        working-directory: release-source
        run: python3 ../extras/release/publish_image.py --tag "$RELEASE_TAG"
      - name: Update latest only for the current published release
        working-directory: release-source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest_tag="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)"
          if [[ "$latest_tag" == "$RELEASE_TAG" ]]; then
            python3 ../extras/release/publish_image.py --tag "$RELEASE_TAG" --latest
          fi
