---
name: Official MAVROS runtime

# yamllint disable-line rule:truthy
on:
  pull_request:
    paths:
      - "extras/mavros/**"
      - "extras/ros-lyrical-gz-jetty-install.sh"
      - ".docker/lyrical.*.dockerfile"
      - ".github/workflows/mavros-router.yml"
  push:
    branches: [main]
    paths:
      - "extras/mavros/**"
      - "extras/ros-lyrical-gz-jetty-install.sh"
      - ".docker/lyrical.*.dockerfile"
      - ".github/workflows/mavros-router.yml"

permissions:
  contents: read

env:
  # Replace only after both Router fixes reach a release and Lyrical binary packages.
  # This sentinel intentionally prevents this retirement draft from passing CI.
  MAVROS_FIXED_VERSION: UNRELEASED

jobs:
  router-tests:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-26.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    container: ros:lyrical-ros-base
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install the official ROS packages
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential cmake curl git python3-colcon-common-extensions \
            ros-lyrical-mavros ros-lyrical-mavros-msgs
      - name: Require the reviewed official MAVROS release
        shell: bash
        run: |
          source /opt/ros/lyrical/setup.bash
          actual="$(ros2 pkg xml mavros --tag version)"
          if [[ "$actual" != "$MAVROS_FIXED_VERSION" ]]; then
            echo "Awaiting the reviewed official release: expected $MAVROS_FIXED_VERSION, found $actual" >&2
            exit 1
          fi
      - name: Verify POSIM selects the official libraries in a fresh terminal
        shell: bash
        run: |
          source /opt/ros/lyrical/setup.bash
          colcon --log-base /tmp/posim-check/log build \
            --base-paths examples/posim_demos \
            --build-base /tmp/posim-check/build \
            --install-base /tmp/posim-check/install --merge-install \
            --cmake-args -DBUILD_TESTING=OFF
          env -i HOME="$HOME" PATH=/usr/bin:/bin bash -c '
            source /tmp/posim-check/install/setup.bash
            test "$(ros2 pkg prefix mavros)" = /opt/ros/lyrical
            python3 extras/mavros/test_library_selection.py /opt/ros/lyrical
          '
