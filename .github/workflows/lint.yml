---
name: Code Formatting Lint

# yamllint disable-line rule:truthy
on:
  push:
    tags: ["v*"]
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  run-linters:
    name: Run Linters for Code Format Check
    runs-on: ubuntu-26.04
    timeout-minutes: 30

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7.1.0
        with:
          python-version: 3.12

      - name: Install Python dependencies
        # Match the formatter versions used by .pre-commit-config.yaml.
        run: >-
          python -m pip install black==24.10.0 flake8==7.1.1
          clang-format==19.1.6 cmakelang==0.6.13 yamllint==1.35.1

      - name: Install system lint dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2-utils shellcheck

      - name: Run repository linters
        run: bash extras/lint_local/lint_local.sh
