---
name: Documentation

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/release-candidate.json"
      - "docs/releases/**"
      - "CHANGELOG.md"
      - "website/**"
      - "gazebo/**"
      - "extras/**"
      - "models/**"
      - "examples/**"
      - "posim_interfaces/**"
      - ".github/workflows/documentation.yml"
      - ".github/actions/ubuntu-mirrors/**"
  push:
    branches: [main]
    paths:
      - ".github/release-candidate.json"
      - "docs/releases/**"
      - "CHANGELOG.md"
      - "website/**"
      - "gazebo/**"
      - "extras/**"
      - "models/**"
      - "examples/**"
      - "posim_interfaces/**"
      - ".github/workflows/documentation.yml"
      - ".github/actions/ubuntu-mirrors/**"

permissions:
  contents: read

concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  static-site:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Install pinned dependencies
        run: npx --yes pnpm@10.11.0 install --frozen-lockfile --ignore-scripts
      - name: Build and check all eight languages against source
        env:
          SITE_URL: https://ioes-lab.github.io/POSIM
        run: |
          node scripts/build.mjs
          node scripts/check.mjs
      - name: Verify website-only deployment
        run: |
          mkdir -p "$RUNNER_TEMP/posim-documentation"
          cp -R . "$RUNNER_TEMP/posim-documentation/website"
          cd "$RUNNER_TEMP/posim-documentation/website"
          node scripts/build.mjs
          node scripts/check.mjs
      - uses: ./.github/actions/ubuntu-mirrors
        with:
          configure-hosts: 'true'
      - name: Install Chromium for browser checks
        run: node node_modules/@playwright/test/cli.js install --with-deps chromium
      - name: Check desktop and mobile documentation
        id: browser-checks
        run: node node_modules/@playwright/test/cli.js test
      - name: Upload browser review evidence
        if: ${{ !cancelled() && steps.browser-checks.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7
        with:
          name: documentation-browser-${{ github.run_attempt }}
          path: website/.validation/
          include-hidden-files: true
          retention-days: 7
      - name: Upload public documentation
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: website/dist

  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: static-site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
