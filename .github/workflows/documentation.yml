---
name: Documentation

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "website/**"
      - "models/**"
      - "examples/**"
      - "posim_interfaces/**"
      - ".github/workflows/documentation.yml"
  push:
    branches: [main]
    paths:
      - "website/**"
      - "models/**"
      - "examples/**"
      - "posim_interfaces/**"
      - ".github/workflows/documentation.yml"

permissions:
  contents: read

concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  static-site:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install pinned dependencies
        run: npx --yes pnpm@10.11.0 install --frozen-lockfile --ignore-scripts
      - name: Build and check both languages against source
        env:
          SITE_URL: https://ioes-lab.github.io/POSIM
        run: |
          node scripts/build.mjs
          node scripts/check.mjs
      - name: Verify website-only deployment
        run: |
          mkdir -p "$RUNNER_TEMP/posim-documentation"
          cp -R . "$RUNNER_TEMP/posim-documentation/website"
          cd "$RUNNER_TEMP/posim-documentation/website"
          node scripts/build.mjs
          node scripts/check.mjs
      - name: Upload public documentation
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: website/dist

  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: static-site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
