---
name: GitHub AMD64 build and upload benchmark

# Isolated manual experiment; never publishes latest or a release version.
# yamllint disable-line rule:truthy
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: ioeslab/posim

jobs:
  revision:
    runs-on: ubuntu-26.04
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      tag: ${{ steps.source.outputs.tag }}
      publish: 'true'
    steps:
      - name: Select fixed release source and isolated test tag
        id: source
        run: |
          echo 'sha=f9c7a399123328474293a55f04b28181c063f979' >> "$GITHUB_OUTPUT"
          echo "tag=qa-github-runner-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

  build:
    needs: revision
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-26.04
            dockerfile: .docker/lyrical.amd64.dockerfile
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.revision.outputs.sha }}
      - name: Resolve Ubuntu package mirrors for BuildKit
        id: ubuntu-mirrors
        uses: ./.github/actions/ubuntu-mirrors
      - uses: docker/setup-buildx-action@v4
        with:
          version: v0.38.1
          driver-opts: image=moby/buildkit:v0.34.2
      - name: Log in to Docker Hub
        if: needs.revision.outputs.publish == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Record before-build resources
        run: |
          mkdir -p "$RUNNER_TEMP/amd64-benchmark"
          date -u +%FT%TZ > "$RUNNER_TEMP/amd64-benchmark/before-build-time.txt"
          df -B1 > "$RUNNER_TEMP/amd64-benchmark/before-build-disk.txt"
          cat /proc/net/dev > "$RUNNER_TEMP/amd64-benchmark/before-build-network.txt"
          ip route show default > "$RUNNER_TEMP/amd64-benchmark/before-build-route.txt"
          df -h
      - name: Build and load the architecture image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/${{ matrix.arch }}
          add-hosts: ${{ steps.ubuntu-mirrors.outputs.hosts }}
          load: true
          tags: ${{ env.IMAGE_NAME }}:${{ needs.revision.outputs.tag }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/IOES-Lab/POSIM
            org.opencontainers.image.revision=${{ needs.revision.outputs.sha }}
      - name: Record after-build resources
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/amd64-benchmark"
          date -u +%FT%TZ > "$RUNNER_TEMP/amd64-benchmark/after-build-time.txt"
          df -B1 > "$RUNNER_TEMP/amd64-benchmark/after-build-disk.txt"
          cat /proc/net/dev > "$RUNNER_TEMP/amd64-benchmark/after-build-network.txt"
          ip route show default > "$RUNNER_TEMP/amd64-benchmark/after-build-route.txt"
          df -h
      - name: Test the installed image
        timeout-minutes: 15
        env:
          IMAGE_TAG: ${{ needs.revision.outputs.tag }}-${{ matrix.arch }}
          TEST_CONTAINER: >-
            posim-test-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}
        run: |
          results="$RUNNER_TEMP/posim-image-tests-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          results+="-${{ matrix.arch }}"
          mkdir -p "$results"
          cleanup() {
            docker rm -f "$TEST_CONTAINER" >/dev/null 2>&1 || true
            docker run --rm --entrypoint chown \
              --mount "type=bind,source=$results,target=/tmp/posim-image-tests" \
              "$IMAGE_NAME:$IMAGE_TAG" -R "$(id -u):$(id -g)" /tmp/posim-image-tests
          }
          trap cleanup EXIT
          docker run --rm --init --interactive --name "$TEST_CONTAINER" --shm-size=1g \
            --mount "type=bind,source=$results,target=/tmp/posim-image-tests" \
            --entrypoint bash "$IMAGE_NAME:$IMAGE_TAG" -s < .docker/test-image.sh
      - name: Preserve image test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: image-tests-${{ matrix.arch }}
          path: >-
            ${{ format('{0}/posim-image-tests-{1}-{2}-{3}',
            runner.temp, github.run_id, github.run_attempt, matrix.arch) }}
          if-no-files-found: ignore
      - name: Record before-push resources
        run: |
          mkdir -p "$RUNNER_TEMP/amd64-benchmark"
          date -u +%FT%TZ > "$RUNNER_TEMP/amd64-benchmark/before-push-time.txt"
          df -B1 > "$RUNNER_TEMP/amd64-benchmark/before-push-disk.txt"
          cat /proc/net/dev > "$RUNNER_TEMP/amd64-benchmark/before-push-network.txt"
          ip route show default > "$RUNNER_TEMP/amd64-benchmark/before-push-route.txt"
          df -h
      - name: Push the tested architecture image
        if: needs.revision.outputs.publish == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/${{ matrix.arch }}
          add-hosts: ${{ steps.ubuntu-mirrors.outputs.hosts }}
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ needs.revision.outputs.tag }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/IOES-Lab/POSIM
            org.opencontainers.image.revision=${{ needs.revision.outputs.sha }}
      - name: Record after-push resources
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/amd64-benchmark"
          date -u +%FT%TZ > "$RUNNER_TEMP/amd64-benchmark/after-push-time.txt"
          df -B1 > "$RUNNER_TEMP/amd64-benchmark/after-push-disk.txt"
          cat /proc/net/dev > "$RUNNER_TEMP/amd64-benchmark/after-push-network.txt"
          ip route show default > "$RUNNER_TEMP/amd64-benchmark/after-push-route.txt"
          df -h
      - name: Preserve resource measurements
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: github-amd64-resources
          path: ${{ runner.temp }}/amd64-benchmark/**
          if-no-files-found: error
      - name: Remove the loaded test image
        if: always()
        env:
          IMAGE_TAG: ${{ needs.revision.outputs.tag }}-${{ matrix.arch }}
        run: docker image rm "$IMAGE_NAME:$IMAGE_TAG" || true
