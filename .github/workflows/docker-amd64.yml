---
name: Native Ubuntu installation qualification

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
    inputs:
      source_revision:
        description: "Exact IOES-Lab/POSIM source revision to qualify"
        type: string
        required: true

permissions:
  contents: read

jobs:
  native-install:
    runs-on: ubuntu-26.04
    timeout-minutes: 180
    env:
      DEBIAN_FRONTEND: noninteractive
      MAKEFLAGS: -j2
      CMAKE_BUILD_PARALLEL_LEVEL: 2
      POSIM_WAVE_JOBS: 2
      GIT_CONFIG_COUNT: 2
      GIT_CONFIG_KEY_0: gc.auto
      GIT_CONFIG_VALUE_0: 0
      GIT_CONFIG_KEY_1: maintenance.auto
      GIT_CONFIG_VALUE_1: 'false'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_revision }}
          path: workspace/src/posim
          persist-credentials: false
      - name: Install the documented native stack
        run: |
          mkdir -p "$RUNNER_TEMP/native-results"
          cd workspace
          POSIM_EXTRAS_DIR="$PWD/src/posim/extras" \
            bash src/posim/extras/ros-lyrical-gz-jetty-install.sh \
            2>&1 | tee "$RUNNER_TEMP/native-results/install.log"
      - name: Resolve and build the native workspace
        run: |
          source "$HOME/.ros_ardusub_env/env"
          cd workspace
          vcs import src --shallow --skip-existing \
            --input src/posim/extras/repos/posim.lyrical.repos
          rosdep install --rosdistro lyrical --from-paths src --ignore-src -y
          colcon build --merge-install --executor sequential --symlink-install \
            2>&1 | tee "$RUNNER_TEMP/native-results/build.log"
      - name: Test installed rendering and sensors
        run: |
          source "$HOME/.ros_ardusub_env/env"
          export POSIM_WS="$GITHUB_WORKSPACE/workspace"
          export POSIM_RVIZ_OVERLAY=/opt/posim/rviz-close
          bash workspace/src/posim/.docker/test-image.sh \
            2>&1 | tee "$RUNNER_TEMP/native-results/tests.log"
      - name: Preserve installation and test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-ubuntu-install
          path: |
            ${{ runner.temp }}/native-results/**
            /tmp/posim-image-tests/**
            workspace/log/**
          if-no-files-found: warn
