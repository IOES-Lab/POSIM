---
name: Build and publish POSIM Docker images

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: "Branch in IOES-Lab/POSIM to build; only main publishes images"
        type: string
        default: main
        required: true
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]
    paths:
      - ".github/release-candidate.json"
      - ".docker/**"
      - ".dockerignore"
      - ".github/workflows/docker-*.yml"
      - ".github/actions/ubuntu-mirrors/**"
      - "posim_interfaces/**"
      - "examples/**"
      - "extras/**"
      - "gazebo/**"
      - "models/**"
  push:
    branches: [main]

env:
  IMAGE_NAME: ioeslab/posim

permissions:
  contents: read
  actions: read

concurrency:
  group: >-
    ${{ github.event_name == 'pull_request' &&
    format('posim-images-pr-{0}', github.event.pull_request.number) ||
    (github.event_name == 'workflow_dispatch' && inputs.source_branch != 'main' &&
    format('posim-images-review-{0}', inputs.source_branch)) || 'posim-images-public' }}
  cancel-in-progress: true

jobs:
  revision:
    # Keep full image builds limited to branches in this repository.
    if: >-
      vars.POSIM_ENABLE_DOCKER_CI == 'true' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository) &&
      (github.event.action != 'labeled' || github.event.label.name == 'release-candidate')
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      tag: ${{ steps.source.outputs.tag }}
      publish: ${{ steps.source.outputs.publish }}
      tree: ${{ steps.source.outputs.tree }}
      kind: ${{ steps.source.outputs.kind }}
      reuse: ${{ steps.reuse.outputs.reuse || 'false' }}
      digest: ${{ steps.reuse.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Manual review builds resolve only branches in this repository.
          # Fork PRs remain excluded from full image builds above.
          ref: >-
            ${{ github.event_name == 'workflow_dispatch' &&
            format('refs/heads/{0}', inputs.source_branch) ||
            github.event.pull_request.head.sha || github.sha }}
      - name: Select source revision and publication tags
        id: source
        env:
          PUBLISH_IMAGES: ${{ vars.POSIM_PUBLISH_IMAGES }}
          SOURCE_BRANCH: ${{ inputs.source_branch }}
          CANDIDATE_PR: >-
            ${{ github.event_name == 'pull_request' &&
            contains(github.event.pull_request.labels.*.name, 'release-candidate') }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          source_sha="$(git rev-parse HEAD)"
          source_tree="$(git rev-parse 'HEAD^{tree}')"
          image_tag="sha-${source_sha:0:12}"
          publish=false
          kind=main
          if [[ "$GITHUB_EVENT_NAME" != pull_request && "$PUBLISH_IMAGES" == true ]] &&
             [[ "$GITHUB_EVENT_NAME" != workflow_dispatch || "$SOURCE_BRANCH" == main ]]; then
            publish=true
          elif [[ "$CANDIDATE_PR" == true && "$PUBLISH_IMAGES" == true ]]; then
            publish=true
            kind=candidate
            image_tag="candidate-pr$PR_NUMBER-${source_sha:0:12}-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          fi
          {
            echo "sha=$source_sha"
            echo "tree=$source_tree"
            echo "tag=$image_tag"
            echo "publish=$publish"
            echo "kind=$kind"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
        if: steps.source.outputs.publish == 'true' && steps.source.outputs.kind == 'main'
        with:
          version: v0.38.1
      - name: Find a tested candidate with an identical source tree
        id: reuse
        if: steps.source.outputs.publish == 'true' && steps.source.outputs.kind == 'main'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: python3 extras/release/reuse_image.py select --sha "$SOURCE_SHA"

  build:
    needs: revision
    if: needs.revision.outputs.reuse != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-26.04
            dockerfile: .docker/lyrical.amd64.dockerfile
          - arch: arm64
            runner: ubuntu-26.04-arm
            dockerfile: .docker/lyrical.arm64v8.dockerfile
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.revision.outputs.sha }}
      - name: Resolve Ubuntu package mirrors for BuildKit
        id: ubuntu-mirrors
        uses: ./.github/actions/ubuntu-mirrors
      - uses: docker/setup-buildx-action@v4
        with:
          version: v0.38.1
          driver-opts: image=moby/buildkit:v0.34.2
      - name: Log in to Docker Hub
        if: needs.revision.outputs.publish == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and load the architecture image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/${{ matrix.arch }}
          add-hosts: ${{ steps.ubuntu-mirrors.outputs.hosts }}
          load: true
          tags: ${{ env.IMAGE_NAME }}:${{ needs.revision.outputs.tag }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/IOES-Lab/POSIM
            org.opencontainers.image.revision=${{ needs.revision.outputs.sha }}
            ioeslab.posim.source-tree=${{ needs.revision.outputs.tree }}
            ioeslab.posim.build-run-id=${{ github.run_id }}
            ioeslab.posim.build-run-attempt=${{ github.run_attempt }}
      - name: Test the installed image
        timeout-minutes: 15
        env:
          IMAGE_TAG: ${{ needs.revision.outputs.tag }}-${{ matrix.arch }}
          TEST_CONTAINER: >-
            posim-test-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}
        run: |
          results="$RUNNER_TEMP/posim-image-tests-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          results+="-${{ matrix.arch }}"
          mkdir -p "$results"
          cleanup() {
            docker rm -f "$TEST_CONTAINER" >/dev/null 2>&1 || true
            docker run --rm --entrypoint chown \
              --mount "type=bind,source=$results,target=/tmp/posim-image-tests" \
              "$IMAGE_NAME:$IMAGE_TAG" -R "$(id -u):$(id -g)" /tmp/posim-image-tests
          }
          trap cleanup EXIT
          docker run --rm --init --interactive --name "$TEST_CONTAINER" --shm-size=1g \
            --mount "type=bind,source=$results,target=/tmp/posim-image-tests" \
            --entrypoint bash "$IMAGE_NAME:$IMAGE_TAG" -s < .docker/test-image.sh
      - name: Preserve image test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: image-tests-${{ matrix.arch }}-${{ github.run_attempt }}
          path: >-
            ${{ format('{0}/posim-image-tests-{1}-{2}-{3}',
            runner.temp, github.run_id, github.run_attempt, matrix.arch) }}
          if-no-files-found: ignore
      - name: Push the tested architecture image
        if: needs.revision.outputs.publish == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/${{ matrix.arch }}
          add-hosts: ${{ steps.ubuntu-mirrors.outputs.hosts }}
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ needs.revision.outputs.tag }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/IOES-Lab/POSIM
            org.opencontainers.image.revision=${{ needs.revision.outputs.sha }}
            ioeslab.posim.source-tree=${{ needs.revision.outputs.tree }}
            ioeslab.posim.build-run-id=${{ github.run_id }}
            ioeslab.posim.build-run-attempt=${{ github.run_attempt }}
      - name: Remove the loaded test image
        if: always()
        env:
          IMAGE_TAG: ${{ needs.revision.outputs.tag }}-${{ matrix.arch }}
        run: docker image rm "$IMAGE_NAME:$IMAGE_TAG" || true

  publish:
    needs: [revision, build]
    if: >-
      always() && needs.revision.result == 'success' &&
      needs.revision.outputs.publish == 'true' &&
      (needs.build.result == 'success' ||
       (needs.build.result == 'skipped' && needs.revision.outputs.reuse == 'true'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.revision.outputs.sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish the complete multi-platform image
        env:
          IMAGE_TAG: ${{ needs.revision.outputs.tag }}
          REUSE_DIGEST: ${{ needs.revision.outputs.digest }}
        run: |
          if [[ -n "$REUSE_DIGEST" ]]; then
            if existing="$(docker buildx imagetools inspect "$IMAGE_NAME:$IMAGE_TAG" \
              --format '{{.Manifest.Digest}}' 2>&1)"; then
              if [[ "$existing" != "$REUSE_DIGEST" ]]; then
                echo "Commit image already points to a different digest" >&2
                exit 1
              fi
            elif [[ "$existing" == *": not found" ]]; then
              docker buildx imagetools create --tag "$IMAGE_NAME:$IMAGE_TAG" "$IMAGE_NAME@$REUSE_DIGEST"
            else
              echo "$existing" >&2
              exit 1
            fi
            actual="$(docker buildx imagetools inspect "$IMAGE_NAME:$IMAGE_TAG" \
              --format '{{.Manifest.Digest}}')"
            if [[ "$actual" != "$REUSE_DIGEST" ]]; then
              echo "Reused image digest changed during promotion" >&2
              exit 1
            fi
          else
            docker buildx imagetools create --tag "$IMAGE_NAME:$IMAGE_TAG" \
              "$IMAGE_NAME:$IMAGE_TAG-amd64" "$IMAGE_NAME:$IMAGE_TAG-arm64"
          fi
          docker buildx imagetools inspect "$IMAGE_NAME:$IMAGE_TAG"
      - name: Record the tested image and its build provenance
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.revision.outputs.sha }}
          SOURCE_TREE: ${{ needs.revision.outputs.tree }}
          IMAGE_TAG: ${{ needs.revision.outputs.tag }}
          PUBLICATION_KIND: ${{ needs.revision.outputs.kind }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python3 extras/release/reuse_image.py record --sha "$SOURCE_SHA" \
            --tree "$SOURCE_TREE" --tag "$IMAGE_TAG" --kind "$PUBLICATION_KIND" \
            --output "$RUNNER_TEMP/image-receipt.json"
      - uses: actions/upload-artifact@v6
        with:
          name: posim-image-receipt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/image-receipt.json
          if-no-files-found: error
          retention-days: 30
