---
name: Build Lyrical / Jetty Docker image (AMD64)

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".docker/**"
      - ".dockerignore"
      - ".github/workflows/docker-amd64.yml"
      - "dave_interfaces/**"
      - "examples/**"
      - "extras/**"
      - "gazebo/**"
      - "models/**"
      - "README.md"
  push:
    tags: ["v*"]
    branches: [main]

env:
  IMAGE_NAME: ioeslab/posim
  ROS_DISTRO: lyrical
  VALIDATION_IMAGE: posim-validation:amd64-${{ github.run_id }}-${{ github.run_attempt }}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push-to-docker-hub:
    # Never execute untrusted fork code on a self-hosted runner.
    if: >-
      vars.POSIM_ENABLE_DOCKER_CI == 'true' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, x64]
    timeout-minutes: 1440
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
            suffix=-amd64
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: ${{ env.VALIDATION_IMAGE }}
          labels: ${{ steps.meta.outputs.labels }}
          file: .docker/lyrical.amd64.dockerfile
          platforms: linux/amd64
          build-args: |
            ROS_DISTRO=${{ env.ROS_DISTRO }}

      - name: Validate installed image and Quickstarts
        # 14 initial paths + 63 additional trials, including two SITL vehicles.
        timeout-minutes: 75
        run: |
          bash extras/ci/docker_quickstarts.sh "$VALIDATION_IMAGE" linux/amd64 \
            "$RUNNER_TEMP/posim-validation-${{ github.run_id }}-${{ github.run_attempt }}"

      - name: Preserve runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: posim-amd64-runtime-${{ github.run_attempt }}
          path: ${{ runner.temp }}/posim-validation-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14

      - name: Log in to Docker Hub
        if: >-
          vars.POSIM_PUBLISH_IMAGES == 'true' && github.event_name != 'pull_request' &&
          (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish the tested image
        if: >-
          vars.POSIM_PUBLISH_IMAGES == 'true' && github.event_name != 'pull_request' &&
          (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        env:
          PUBLISH_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          results="$RUNNER_TEMP/posim-validation-${{ github.run_id }}-${{ github.run_attempt }}"
          tested_id="$(cat "$results/tested-image-id.txt")"
          test "$(docker image inspect --format '{{.Id}}' "$VALIDATION_IMAGE")" = "$tested_id"
          while IFS= read -r tag; do
            test -n "$tag" || continue
            docker tag "$tested_id" "$tag"
            docker push "$tag"
          done <<< "$PUBLISH_TAGS"
