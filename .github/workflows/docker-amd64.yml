---
name: Build and publish POSIM Docker images

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".docker/**"
      - ".dockerignore"
      - ".github/workflows/docker-*.yml"
      - "posim_interfaces/**"
      - "examples/**"
      - "extras/**"
      - "gazebo/**"
      - "models/**"
  push:
    branches: [main]
    tags: ["v*"]

env:
  IMAGE_NAME: ioeslab/posim

permissions:
  contents: read

concurrency:
  group: >-
    ${{ github.event_name == 'pull_request' &&
    format('posim-images-pr-{0}', github.event.pull_request.number) || 'posim-images-public' }}
  cancel-in-progress: true

jobs:
  revision:
    # Fork code must never execute on the self-hosted AMD64 runner.
    if: >-
      vars.POSIM_ENABLE_DOCKER_CI == 'true' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      tag: ${{ steps.source.outputs.tag }}
      publish: ${{ steps.source.outputs.publish }}
      latest: ${{ steps.source.outputs.latest }}
      version: ${{ steps.source.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Manual runs always build main, even when testing this workflow from a PR.
          ref: >-
            ${{ github.event_name == 'workflow_dispatch' && 'main' ||
            github.event.pull_request.head.sha || github.sha }}
      - name: Select source revision and publication tags
        id: source
        env:
          PUBLISH_IMAGES: ${{ vars.POSIM_PUBLISH_IMAGES }}
        run: |
          source_sha="$(git rev-parse HEAD)"
          publish=false
          latest=false
          version=''
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            expected_version="$(python3 -c 'import json; print(json.load(open("website/package.json"))["version"])')"
            if [[ "$version" != "$expected_version" ]]; then
              echo "Tag $GITHUB_REF_NAME does not match the documentation version $expected_version" >&2
              exit 1
            fi
          fi
          if [[ "$GITHUB_EVENT_NAME" != pull_request && "$PUBLISH_IMAGES" == true ]]; then
            publish=true
            if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch || "$GITHUB_REF" == refs/heads/main ]]; then
              latest=true
            fi
          fi
          {
            echo "sha=$source_sha"
            echo "tag=sha-${source_sha:0:12}"
            echo "publish=$publish"
            echo "latest=$latest"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: revision
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: [self-hosted, Linux, X64]
            dockerfile: .docker/lyrical.amd64.dockerfile
          - arch: arm64
            runner: ubuntu-26.04-arm
            dockerfile: .docker/lyrical.arm64v8.dockerfile
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 1440
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.revision.outputs.sha }}
      - name: Resolve Ubuntu package mirrors for BuildKit
        id: ubuntu-mirrors
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          mirrors=(archive.ubuntu.com security.ubuntu.com)
          if [[ "$ARCH" == arm64 ]]; then
            mirrors=(ports.ubuntu.com)
          fi
          hosts=()
          for mirror in "${mirrors[@]}"; do
            if ! read -r ip _ < <(getent ahostsv4 "$mirror"); then
              # The runner's resolver can fail for Ubuntu mirrors during CI.
              ip="$(curl -fsS --retry 2 --max-time 10 "https://dns.google/resolve?name=$mirror&type=A" |
                python3 -c 'import json, sys
          answers = json.load(sys.stdin).get("Answer", [])
          print(next((a["data"] for a in answers if a["type"] == 1), ""))')" || ip=''
            fi
            if [[ -z "$ip" ]]; then
              echo "::error::Could not resolve $mirror on the Docker build runner"
              exit 1
            fi
            hosts+=("$mirror:$ip")
          done
          {
            echo 'hosts<<EOF'
            printf '%s\n' "${hosts[@]}"
            echo EOF
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - name: Log in to Docker Hub
        if: needs.revision.outputs.publish == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and optionally push the architecture image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/${{ matrix.arch }}
          add-hosts: ${{ steps.ubuntu-mirrors.outputs.hosts }}
          push: ${{ needs.revision.outputs.publish == 'true' }}
          tags: ${{ env.IMAGE_NAME }}:${{ needs.revision.outputs.tag }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/IOES-Lab/POSIM
            org.opencontainers.image.revision=${{ needs.revision.outputs.sha }}
      - name: Remove unused POSIM images older than two days
        if: always() && matrix.arch == 'amd64'
        run: |
          docker image prune --all --force --filter until=48h \
            --filter label=org.opencontainers.image.source=https://github.com/IOES-Lab/POSIM

  publish:
    needs: [revision, build]
    if: needs.revision.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish the complete multi-platform image
        env:
          IMAGE_TAG: ${{ needs.revision.outputs.tag }}
          UPDATE_LATEST: ${{ needs.revision.outputs.latest }}
          VERSION_TAG: ${{ needs.revision.outputs.version }}
        run: |
          tags=(--tag "$IMAGE_NAME:$IMAGE_TAG")
          if [[ "$UPDATE_LATEST" == true ]]; then
            tags+=(--tag "$IMAGE_NAME:latest")
          fi
          if [[ -n "$VERSION_TAG" ]]; then
            tags+=(--tag "$IMAGE_NAME:$VERSION_TAG")
          fi
          docker buildx imagetools create "${tags[@]}" \
            "$IMAGE_NAME:$IMAGE_TAG-amd64" "$IMAGE_NAME:$IMAGE_TAG-arm64"
          docker buildx imagetools inspect "$IMAGE_NAME:$IMAGE_TAG"
