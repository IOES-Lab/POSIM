---
name: Desktop launcher checks

# yamllint disable-line rule:truthy
on:
  pull_request:
    branches: [main]
    paths:
      - ".docker/**"
      - "models/posim_robot_models/config/**"
      - "models/posim_robot_models/test/test_desktop_launch.py"
      - ".github/workflows/docker-launcher-tests.yml"
  push:
    branches: [main]
    paths:
      - ".docker/**"
      - "models/posim_robot_models/config/**"
      - "models/posim_robot_models/test/test_desktop_launch.py"
      - ".github/workflows/docker-launcher-tests.yml"

permissions:
  contents: read

jobs:
  launcher-contract:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check shell syntax and launcher behavior
        run: |
          bash -n .docker/qgroundcontrol-arm64.sh
          bash -n .docker/qgroundcontrol.sh
          bash -n .docker/firefox.sh
          bash -n .docker/desktop-app.sh
          bash -n .docker/rdp-runtime-env.sh
          python3 .docker/tests/test_rdp_runtime_env.py
          python3 .docker/tests/test_qgroundcontrol_arm64.py
          python3 models/posim_robot_models/test/test_desktop_launch.py
